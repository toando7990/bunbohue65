  <script>
    (function () {
      try {
        var pathname = window.location.pathname.replace(/\/$/, '');
        var roleMap = {
          '/cashier-view': 'cashier',
          '/kitchen-view': 'kitchen',
          '/waiter-view': 'waiter',
          '/delivery-view': 'delivery'
        };
        var role = roleMap[pathname];
        if (role) {
          var params = new URLSearchParams(window.location.search);
          var token = params.get('token');
          var restaurantId = params.get('restaurantId');
          if (token && restaurantId) {
            localStorage.setItem('staffToken_' + role, token);
            localStorage.setItem('staffToken_' + role + '_' + restaurantId, token);
            localStorage.setItem('restaurantId_' + role, restaurantId);
          }
        }
      } catch (e) { /* ignore storage errors */ }
    })();
  </script>
