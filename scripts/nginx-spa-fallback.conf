# =============================================================================
# nginx-spa-fallback.conf
# Cau hinh Nginx server block mau cho SPA bunbohue65.vn
# Fix loi 404 khi refresh truc tiep cac route con (vd: /enterprise-delivery)
# -----------------------------------------------------------------------------
# File nginx tren VPS: /etc/nginx/sites-enabled/bunbohue65-proxy
# VPS: 103.149.170.47 (FPT)
# =============================================================================
#
# NGUYEN NHAN LOI 404 KHI REFRESH:
#   Frontend dung TanStack Router o history mode (createBrowserHistory mac dinh),
#   khong phai hash mode. Khi nguoi dung truy cap truc tiep hoac refresh
#   https://www.bunbohue65.vn/enterprise-delivery, trinh duyet gui request
#   GET /enterprise-delivery len Nginx. Nginx tim file /var/www/bunbohue65/dist/enterprise-delivery
#   khong ton tai -> tra 404.
#
# GIAI PHAP:
#   Them chi thi `try_files $uri $uri/ /index.html;` trong location / block.
#   Khi Nginx khong tim thay file tinh, no fallback ve /index.html (file SPA chinh),
#   de TanStack Router phan tich URL va render dung route.
#
# CACH AP DUNG:
#   CACH 1 (khuyen nghi): Chay script tu dong
#       bash scripts/setup-spa-fallback.sh
#
#   CACH 2 (thu cong): Copy noi dung server block duoi day, chinh sua root path
#       cho dung, dan vao file /etc/nginx/sites-enabled/bunbohue65-proxy
#       tren VPS, sau do:
#       nginx -t && systemctl reload nginx
#
# Xem them: scripts/README-SPA-FALLBACK.md
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP -> HTTPS redirect (port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.bunbohue65.vn bunbohue65.vn;

    # Chuyen huong tat ca HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# HTTPS server block chinh (port 443)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.bunbohue65.vn bunbohue65.vn;

    # -------------------------------------------------------------------------
    # SSL certificates
    # Let's Encrypt (doi path neu dung cert khac, vd: /etc/letsencrypt/live/...)
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/bunbohue65.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunbohue65.vn/privkey.pem;

    # TLS settings (hien dai, an toan)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # -------------------------------------------------------------------------
    # ROOT -- Thu muc chua build Vite (dist/)
    # !!! DOI PATH NAY CHO DUNG VOI THUC TE TREN VPS !!!
    # Mac dinh: /var/www/bunbohue65/dist
    # Neu deploy khac, vd: /var/www/bunbohue65.vn/dist -> doi cho dung
    # -------------------------------------------------------------------------
    root /var/www/bunbohue65/dist;
    index index.html;

    # -------------------------------------------------------------------------
    # GZIP -- nen cac assets de giam bandwidth
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # LOCATION / -- SPA FALLBACK (CHINH DE FIX LOI 404)
    # -------------------------------------------------------------------------
    # try_files $uri $uri/ /index.html;  <-- CHI THI CHINH
    #   1. $uri    -> tim file tinh theo URL (vd: /assets/index-abc.js)
    #   2. $uri/   -> neu la thu muc, tim index.html trong do
    #   3. /index.html -> FALLBACK: khong tim thay file tinh, tra index.html
    #                     de TanStack Router xu ly route phia client
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # STATIC ASSETS -- cache lau (Vite them hash vao ten file)
    # File trong /assets/ co hash trong ten (vd: index-abc123.js) -> cache vinh vi
    # -------------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, robots, sitemap -- cache ngan
    location = /favicon.ico {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # ROBOTS.TXT & SITEMAP.XML
    # -------------------------------------------------------------------------
    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml; charset=utf-8";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # API PROXY -- Backend canister ICP
    # !!! DOI PLACEHOLDER CHO DUNG CANISTER ID CUA BAN !!!
    # VD: https://5trsv-sqaaa-aaaab-qhcoq-cai.raw.icp0.io/api/
    # Hoac dung boundary node: https://icp0.io/api/v2/canister/<CANISTER_ID>/
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         https://<CANISTER_ID>.icp0.io/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # INCLUDE -- AhaMove Worker snippet (neu da co)
    # Bao gom cac route: /ahamove-health, /ahamove-estimate-public,
    # /ahamove-book, /ahamove-webhook -> proxy_pass 127.0.0.1:3002
    # Xem: scripts/nginx-config-snippet.txt
    # -------------------------------------------------------------------------
    # include /etc/nginx/snippets/ahamove-worker.conf;

    # -------------------------------------------------------------------------
    # Bao mat headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # Error pages -- tat ca fallback ve index.html de SPA xu ly
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
}

# =============================================================================
# KIEM TRA SAU KHI AP DUNG:
#
#   nginx -t
#   systemctl reload nginx
#
#   # Test refresh route con (phai tra 200, khong con 404):
#   curl -I https://www.bunbohue65.vn/enterprise-delivery
#   curl -I https://www.bunbohue65.vn/
#
# KET QOA MONG MUON:
#   HTTP/1.1 200 OK  (cho moi route con khi refresh)
# =============================================================================
